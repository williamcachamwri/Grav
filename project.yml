name: Grav
options:
  bundleIdPrefix: com.grav
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  NotchKit:
    url: https://github.com/duongductrong/NotchKit.git
    from: "1.3.0"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_TESTABILITY: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES

targets:
  Grav:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Grav
        excludes:
          - "Resources/Info.plist"
          - "Resources/Grav.entitlements"
    settings:
      base:
        PRODUCT_NAME: Grav
        PRODUCT_BUNDLE_IDENTIFIER: com.grav.telemetry
        INFOPLIST_FILE: Grav/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Grav/Resources/Grav.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - package: NotchKit
        product: NotchKit

  GravTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: GravTests
    settings:
      base:
        PRODUCT_NAME: GravTests
        PRODUCT_BUNDLE_IDENTIFIER: com.grav.telemetry.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Grav.app/Contents/MacOS/Grav"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Grav

schemes:
  Grav:
    build:
      targets:
        Grav: all
        GravTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GravTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
